<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4fbfc" />
    <meta name="description" content="Drug Detective: Moxifloxacin — an interactive chemistry mystery quiz. Explore the molecule, decode spectra, and master safe use." />
    <meta property="og:title" content="Drug Detective | Moxifloxacin Challenge" />
    <meta property="og:description" content="20 interactive case files. One mystery molecule. Can you crack the science?" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('moxifloxacin-theme-v1');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = (saved === 'dark' || saved === 'light') ? saved : (systemDark ? 'dark' : 'light');
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>Drug Detective — Moxifloxacin Challenge</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
